name: Daily Credit Card Crawl

# Refreshes the site's card data entirely in the cloud (GitHub Actions) —
# nothing runs on a personal machine.
#
#   crawl    10 parallel jobs, one per issuer, each on its own runner (so the
#            JS-rendering issuers' headless browsers never compete for
#            memory). Wall time ≈ the slowest issuer, not the sum.
#   publish  merges the 10 results into web/src/cards.snapshot.json
#            (crawler/scripts/export_snapshot.py: stable card ids, issuers
#            that failed keep their current cards), self-hosts any new card
#            art, and commits the change — which redeploys the site if the
#            repo is connected to Vercel.
#
# Safeguards:
#   - A crawl job fails (red X, GitHub emails you) when discovery finds
#     nothing or the LLM provider is erroring; that issuer's run isn't
#     stored, so publish keeps its current cards.
#   - An issuer whose card count drops sharply, or whose fee/APR/name swings
#     overnight, is held off the live site. Its new data goes to a
#     "crawl-review/<date>" branch with a PR explaining why — merge or close.
#   - The bot rebases onto main before pushing, so it never clobbers a
#     commit you made while the crawl was running.
#
# Setup: secrets live in the "crawl" environment (Settings -> Environments),
# which only main can use, so workflows on collaborators' branches can't read
# them: OPENAI_API_KEY, plus CRAWLER_DEPLOY_KEY (private half of the write
# deploy key; main's ruleset lets that key push the snapshot straight to
# main). Without CRAWLER_DEPLOY_KEY, checkout falls back to GITHUB_TOKEN. Tick "Allow GitHub Actions to create and approve pull
# requests" (Settings -> Actions -> General) for the review PRs. Optional:
# SUPABASE_URL + SUPABASE_SERVICE_KEY to also publish to Supabase,
# SLACK_WEBHOOK_URL for failure alerts.

on:
  schedule:
    # 9:00 AM UTC daily — adjust for your audience's timezone.
    - cron: "0 9 * * *"
  workflow_dispatch: {}  # "Run workflow" button in the Actions tab

# Never let two crawls run at once (a slow run overlapping the next schedule).
concurrency:
  group: daily-crawl
  cancel-in-progress: false

permissions:
  contents: write       # the publish job commits the refreshed snapshot
  pull-requests: write  # ...and opens a PR for held-back issuers

jobs:
  crawl:
    name: crawl (${{ matrix.provider }})
    runs-on: ubuntu-latest
    environment: crawl  # secrets are scoped to this environment (main only)
    timeout-minutes: 45
    strategy:
      fail-fast: false  # one issuer failing must not cancel the others
      matrix:
        provider: [chase, amex, capital_one, citi, discover, bank_of_america, wells_fargo, us_bank, barclays, synchrony]
    defaults:
      run:
        working-directory: crawler

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Amex, Bank of America, U.S. Bank and Barclays are render_js
      # providers: their card lists only exist after JavaScript runs. Without
      # a browser the crawler silently falls back to static HTML and finds a
      # fraction of their cards (Amex: 3 of 22).
      - name: Install headless Chromium
        if: contains(fromJSON('["amex","bank_of_america","us_bank","barclays"]'), matrix.provider)
        run: python -m playwright install --with-deps chromium

      # Per-issuer crawl cache (classification verdicts + content hashes), so
      # later runs only spend LLM calls on new or changed pages. Rolling
      # restore: each run loads the most recent previous cache for its issuer.
      - name: Restore crawl cache
        uses: actions/cache@v6
        with:
          path: crawler/data/${{ matrix.provider }}/crawl_cache.json
          key: crawl-cache-${{ matrix.provider }}-${{ github.run_id }}
          restore-keys: |
            crawl-cache-${{ matrix.provider }}-

      - name: Run crawler
        env:
          LLM_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.pipeline --provider ${{ matrix.provider }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crawl-${{ matrix.provider }}
          path: |
            crawler/data/${{ matrix.provider }}/latest.json
            crawler/data/${{ matrix.provider }}/history/
            crawler/logs/
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: crawl
    if: always()  # publish whatever issuers succeeded
    runs-on: ubuntu-latest
    environment: crawl
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crawler

    steps:
      # Checked out with the deploy key so the push below may bypass main's
      # "PRs only" ruleset (GITHUB_TOKEN can't be a bypass actor).
      - uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.CRAWLER_DEPLOY_KEY }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download crawl results
        uses: actions/download-artifact@v8
        with:
          pattern: crawl-*
          path: crawler/artifacts

      # Each artifact holds data/<provider>/latest.json; put them where
      # export_snapshot.py looks (crawler/data/<provider>/latest.json).
      - name: Collect results
        run: |
          mkdir -p data
          for dir in artifacts/crawl-*; do
            provider="${dir#artifacts/crawl-}"
            src=$(find "$dir" -name latest.json -path "*/$provider/*" | head -1)
            if [ -n "$src" ]; then
              mkdir -p "data/$provider" && cp "$src" "data/$provider/latest.json"
              echo "collected $provider"
            fi
          done

      # Holds back suspicious issuers; writes crawl-review.md if any were.
      - name: Export snapshot and card art
        run: |
          python scripts/export_snapshot.py --report ../crawl-review.md
          python scripts/cache_card_art.py

      - name: Commit refreshed card data
        working-directory: .
        run: |
          git config user.name "cardfit-crawler[bot]"
          git config user.email "cardfit-crawler[bot]@users.noreply.github.com"
          git add web/src/cards.snapshot.json web/src/lib/snapshot.ts web/public/card-art
          if git diff --cached --quiet; then
            echo "No card changes today."
            exit 0
          fi
          git commit -m "Card data refresh $(date -u +%Y-%m-%d)"
          # The crawl takes up to 45 minutes; main may have moved since checkout.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Could not rebase the card refresh onto main (conflict with a newer commit?)"
          exit 1

      - name: Open review PR for held-back issuers
        if: hashFiles('crawl-review.md') != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat crawl-review.md >> "$GITHUB_STEP_SUMMARY"
          branch="crawl-review/$(date -u +%Y-%m-%d)"
          git switch -c "$branch"
          (cd crawler && python scripts/export_snapshot.py --include-flagged && python scripts/cache_card_art.py)
          git add web/src/cards.snapshot.json web/src/lib/snapshot.ts web/public/card-art
          git commit -m "Card data needing review $(date -u +%Y-%m-%d)"
          git push --force origin "$branch"
          # A re-run the same day updates the existing PR instead.
          gh pr create --base main --head "$branch" --title "Crawl review: $(date -u +%Y-%m-%d)" --body-file crawl-review.md || gh pr edit "$branch" --body-file crawl-review.md
